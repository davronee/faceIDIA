services:
  nginx:
    image: nginx:alpine
    container_name: faceidia-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      laravel:
        condition: service_healthy
    networks:
      - faceidia-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  laravel:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: faceidia-laravel-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - biometrics_storage:/var/www/html/storage/app/private/biometrics
      - laravel_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - faceidia-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceidia-ai-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - insightface_models:/root/.insightface
    networks:
      - faceidia-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  laravel-worker:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: faceidia-worker-prod
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - biometrics_storage:/var/www/html/storage/app/private/biometrics
      - laravel_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - faceidia-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: ankane/pgvector:latest
    container_name: faceidia-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-faceidia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-faceidia_secure_pass_2026}
      POSTGRES_DB: ${DB_DATABASE:-face_recognition}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c max_connections=150
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - faceidia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: faceidia-redis-prod
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-faceidia_redis_pass_2026}
    command: redis-server --save 300 10 --appendonly yes --appendfsync everysec --maxmemory 4gb --maxmemory-policy allkeys-lru --loglevel warning --requirepass ${REDIS_PASSWORD:-faceidia_redis_pass_2026}
    volumes:
      - redis_data:/data
    networks:
      - faceidia-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD:-faceidia_redis_pass_2026}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: faceidia-certbot-prod
    restart: unless-stopped
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - faceidia-net

volumes:
  postgres_data:
  biometrics_storage:
  insightface_models:
  laravel_logs:
  redis_data:
  certbot_www:

networks:
  faceidia-net:
    driver: bridge
