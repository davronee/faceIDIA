services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: face_recognition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
    container_name: faceidia-backend
    environment:
      # Connects to the db container
      DATABASE_URL: postgres://user:password@db:5432/face_recognition
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: faceidia-frontend
    ports:
      - "80:80"  # Access frontend on http://localhost
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
