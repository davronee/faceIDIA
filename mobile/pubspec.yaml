name: faceidia_mobile
description: Enterprise FaceID Client Mobile App for iOS and Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & Vision
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  image: ^4.2.0

  # Networking
  dio: ^5.4.3+1
  http_parser: ^4.0.2

  # Storage & State
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

